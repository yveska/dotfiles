# Monitors

#   monitor=DP-1, 1920x1080@165.00, 0x0, 1
    monitor=DP-2, 1920x1080@165.00, 1920x0, 1

## Startup

    exec-once = systemctl --user start hyprpolkitagent 
    exec-once = nm-applet
    exec-once = waybar
    exec-once = vicinae server
    exec-once = awww-daemon
    exec-once = wl-paste --type text --watch cliphist store   
    exec-once = wl-paste --type image --watch cliphist store

# Defaults
 
    $terminal = kitty
    $fileManager = nemo
    $menu = vicinae toggle
    $browser = zen-browser
    $notes = emacs
    $music = kitty -e rmpc

# Environment variables

    env = XCURSOR_SIZE,24
    env = HYPRCURSOR_SIZE,24

# Inputs

    input {
        kb_layout = us
        kb_options = grp:alt_shift_toggle
        follow_mouse = 1
        sensitivity = -0.7
        touchpad {
            natural_scroll = false
        }
    }

    cursor {
        no_hardware_cursors = true
    }


# Gaps and Borders

    general {
        gaps_in = 2
        gaps_out = 5
        border_size = 0
        col.active_border = false #rgb(57575f)
        col.inactive_border = false #rgb(2a2a2d)
        resize_on_border = true
        layout = dwindle
        allow_tearing = false
    }

# Shadow and Blur

    decoration {
        rounding = 0
        active_opacity = 1.0 # 0.93
        inactive_opacity = 0.96 # 0.85

    shadow{
        enabled = false
        range = 20
        render_power = 3
        color = rgb(3C3B3E)
    }

    blur {
        enabled = true
        size = 5
        noise = 0.01
        passes = 1
        new_optimizations = true
        xray = false

        special = false
        popups = true
        input_methods = true
        input_methods_ignorealpha = 0.8

        brightness = 0.9
        contrast = 1.2
        vibrancy = 0.6
        }
    }

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
}

    dwindle {
        pseudotile = true
        preserve_split = true
    }

    master {
        new_status = master
    }

# Keybinds

  $mainMod = SUPER

  # App Shortcuts
    
    bind = $mainMod, T, exec, $terminal
    bind = $mainMod, E, exec, $fileManager
    bind = $mainMod, A, exec, $menu
    bind = $mainMod, B, exec, $browser
    bind = $mainMod, O, exec, $notes
    bind = $mainMod, S, exec, $music

    bind = $mainMod SHIFT, T, exec, kitty -e btop

  # Shaders

   # bind = $mainMod, D, exec, /home/adam/.config/hypr/shaders/reading_mode.sh
   bind = $mainMod, D, exec, hyprshade toggle reading_mode
   bind = $mainMod SHIFT, D, exec, hyprshade toggle grayscale

  # App Functions

    bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
    bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
    bind = $mainMod, V, exec, vicinae vicinae://launch/clipboard/history

  # Window Management

    bind = $mainMod, Q, killactive,
    bind = $mainMod, F, fullscreen
    bind = $mainMod SHIFT, SPACE, togglefloating

  # Exit Hyprland

    bind = $mainMod SHIFT, M, exit

  # Script Shortcuts

    bind = $mainMod SHIFT, R, exec, pkill waybar && exec waybar
    bind = $mainMod SHIFT, W, exec, pkill waybar || waybar

  # Switch Workspaces

    bind = $mainMod, 1, workspace, 1
    bind = $mainMod, 2, workspace, 2
    bind = $mainMod, 3, workspace, 3
    bind = $mainMod, 4, workspace, 4
    bind = $mainMod, 5, workspace, 5
    bind = $mainMod, 6, workspace, 6
    bind = $mainMod, 7, workspace, 7
    bind = $mainMod, 8, workspace, 8
    bind = $mainMod, 9, workspace, 9
    bind = $mainMod, 0, workspace, 10

  # Move Windows to Workspaces
    bind = $mainMod SHIFT, 1, movetoworkspace, 1
    bind = $mainMod SHIFT, 2, movetoworkspace, 2
    bind = $mainMod SHIFT, 3, movetoworkspace, 3
    bind = $mainMod SHIFT, 4, movetoworkspace, 4
    bind = $mainMod SHIFT, 5, movetoworkspace, 5
    bind = $mainMod SHIFT, 6, movetoworkspace, 6
    bind = $mainMod SHIFT, 7, movetoworkspace, 7
    bind = $mainMod SHIFT, 8, movetoworkspace, 8
    bind = $mainMod SHIFT, 9, movetoworkspace, 9
    bind = $mainMod SHIFT, 0, movetoworkspace, 10

  # Use Vim Binds

    bind = $mainMod, h, movefocus, l
    bind = $mainMod, l, movefocus, r
    bind = $mainMod, k, movefocus, u
    bind = $mainMod, j, movefocus, d

  # Use Vim Binds to swap windows 
  
    bind = $mainMod SHIFT, h, movewindow, l
    bind = $mainMod SHIFT, j, movewindow, d
    bind = $mainMod SHIFT, k, movewindow, u
    bind = $mainMod SHIFT, l, movewindow, r

  # Move and Resize windows with mainMod + LMB/RMB and dragging, drag on edges to resize.

    bindm = $mainMod, mouse:272, movewindow
    bindm = $mainMod, mouse:273, resizewindow

  # Laptop Keys for Volume and Brightness
    bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
    bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
    bindel = , XF86AudioPlay, exec, playerctl play-pause
    bindel = , XF86AudioPause, exec, playerctl play-pause
    bindel = , XF86AudioNext, exec, playerctl next
    bindel = , XF86AudioPrev, exec, playerctl previous

# Window rules

 # Readest
    env = WEBKIT_DISABLE_DMABUF_RENDERER,1

 # Vicinae
    layerrule {
        name = vicinae-blur
        blur = on
        ignore_alpha = 0
        match:namespace = vicinae
    }

  # disable animation for vicinae only
    layerrule {
        name = vicinae-no-animation
        no_anim = on
        match:namespace = vicinae
    }
  
    misc {
        focus_on_activate = true
    }
